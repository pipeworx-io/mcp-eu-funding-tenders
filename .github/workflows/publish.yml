name: Publish to npm

# Trusted publishing (OIDC) — NO npm token anywhere in this repo.
#
# Why this file exists: npm is withdrawing the ability for access tokens to
# bypass 2FA when publishing. Phase 1 (2026-07-31) already blocked token-driven
# MANAGEMENT operations; Phase 2 (~January 2027) removes DIRECT PUBLISHING, and
# when it lands no token you can create will publish this package. The
# replacement is trusted publishing: GitHub Actions proves this repo's identity
# to npm over OIDC, with no long-lived credential to leak or rotate.
#
# Provenance comes free and is why this workflow lives HERE rather than in the
# pipeworx-core monorepo: npm will only attach a provenance attestation when the
# source repo is PUBLIC, and pipeworx-core is private. This repo is public, and
# package.json's `repository.url` already points at it, which is the match npm
# checks (case-sensitive).
#
# Do NOT add `--provenance`: with trusted publishing npm generates the
# attestation automatically, and passing the flag is redundant.
#
# The FILENAME matters. npm's trusted-publisher config names the org, the repo
# and this file's name — `publish.yml`. Renaming this file silently breaks
# publishing for this package until someone re-runs `npm trust` against the new
# name. Keep it `publish.yml` across every pack repo so the bulk config loop in
# pipeworx-core's scripts/npm-trust-bulk.sh stays a one-liner.
#
# This file is GENERATED by pipeworx-core's scripts/publish-pack.sh from
# scripts/templates/publish-npm.yml. Edit it there — publish-pack.sh rebuilds
# this repo from scratch and force-pushes, so local edits are erased on the next
# publish.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
  workflow_dispatch:

permissions:
  id-token: write   # REQUIRED: lets Actions mint the OIDC token npm authenticates
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest   # must be GitHub-HOSTED; self-hosted runners are unsupported
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # trusted publishing needs Node >= 22.14.0
        # Deliberately NO `registry-url:` — that option exists to inject a token
        # into an .npmrc, writes a literal `_authToken=${NODE_AUTH_TOKEN}` line,
        # and would trip the credential assertion below. npm publish already
        # defaults to registry.npmjs.org.

      - name: Upgrade npm to a trusted-publishing-capable version
        # The runner image's bundled npm lags. Trusted publishing needs npm
        # >= 11.5.1; installing `latest` rather than a pinned version keeps this
        # from silently rotting, and the assertion below fails loudly rather
        # than falling through to a publish that cannot authenticate.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          v=$(npm --version)
          echo "npm $v"
          node -e 'const v=process.argv[1].split("-")[0].split(".").map(Number);
            const min=[11,5,1];
            for (let i=0;i<3;i++){ if(v[i]>min[i]) break; if(v[i]<min[i]){
              console.error(`npm ${process.argv[1]} is below the 11.5.1 trusted-publishing floor`);
              process.exit(1); } }' "$v"

      - name: Assert no npm token is present
        # The whole point of this workflow is that it publishes with NO
        # credential. If a token ever appears, a publish could succeed for the
        # wrong reason and hide a broken OIDC config until Phase 2 removes the
        # token fallback and every pack breaks at once. Fail loudly instead.
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is in the environment; this workflow must publish over OIDC only"
            exit 1
          fi
          tok=$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || echo "undefined")
          if [ "$tok" != "undefined" ] && [ -n "$tok" ]; then
            echo "::error::npm config carries an _authToken; refusing to publish"
            exit 1
          fi
          echo "no npm credential present — publishing over OIDC"

      - name: Skip if this version is already published
        id: check
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name" version 2>/dev/null || echo "")
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$version" ]; then
            # Not an error: most pushes here are README/metadata refreshes from
            # publish-pack.sh, which force-pushes the whole repo. Publishing is
            # the exception, so a same-version push is the normal case.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version already published — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing $name@$version (registry has ${published:-none})"
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        # Do NOT add --provenance: with trusted publishing npm generates the
        # attestation automatically.
        #
        # The error translation below is not decoration. When no trusted
        # publisher is configured for this package, npm does not say so — it
        # returns a generic `ENEEDAUTH / You need to authorize this machine
        # using npm login`, which reads exactly like a forgotten credential and
        # sends you looking for a token. There is no token to find; that is the
        # point. The ENEEDAUTH text itself was seen live in mcp-opentargets run
        # 33261239541 — but note that run executed a plain `npm publish`, so the
        # capture-and-translate below was NOT what produced it.
        #
        # `set -e` IS ON here: GitHub's default `run:` shell is `bash -e {0}` —
        # visible in that run's own step header — and `set -uo pipefail` does not
        # clear it. A bare `out=$(npm publish ...)` therefore aborts the step AT
        # THE ASSIGNMENT the instant publish fails, swallowing npm's output AND
        # skipping the translation, leaving a red step with an EMPTY log. Since
        # every pack fails this way until its trusted publisher exists, that is
        # the common path, not the edge case. `|| rc=$?` keeps the failure
        # in-band. Do not "simplify" it back to a bare assignment.
        run: |
          set -uo pipefail
          out=$(npm publish --access public 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q 'ENEEDAUTH'; then
            # npm-trust-bulk.sh --only matches pack SLUGS, and the repo name is
            # mcp-<slug> — strip the prefix or the suggested command matches
            # nothing (seen live: "--only mcp-csv" → "matched no outstanding
            # published pack").
            repo='${{ github.event.repository.name }}'
            echo "::error::npm returned ENEEDAUTH. This almost certainly means no trusted publisher is configured for this package yet, NOT that a token is missing — this workflow publishes over OIDC and deliberately has no credential. Fix: from pipeworx-core, npm login (interactive, 2FA) then ./scripts/npm-trust-bulk.sh --only ${repo#mcp-}. See docs/npm-trusted-publishing.md."
          fi
          exit $rc

      - name: Report
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "published ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}"
          echo "verify: npm view ${{ steps.check.outputs.name }} dist.attestations"

      # Fleet #3767: list this version on the MCP Registry WITH its npm
      # `packages` entry, now that npm genuinely serves it.
      #
      # release-packs.yml (pipeworx-core) already listed this pack on the
      # registry, remotes-only, before this very workflow ran -- the registry
      # listing and the npm publish happen in two different repos/workflows
      # with nothing synchronizing them, and the registry validates a
      # `packages` entry against npm AT PUBLISH TIME (modelcontextprotocol/
      # registry internal/validators/registries/npm.go: it fetches
      # <name>/<version> and requires package.json's mcpName to match), so an
      # entry created before npm has the version can only ever be
      # remotes-only. By the time this step runs (right after the step
      # above, which either just published this version or found it already
      # published), npm genuinely has it.
      #
      # publish-pack.sh (fleet #3767) knows this and does NOT create a
      # registry entry at all for a gateway-mode pack whose version npm does
      # not yet serve -- deliberately, because /v0/publish is create-only
      # (a repeat call for the same name+version 400s "already exists") and
      # a GitHub-OIDC JWT only ever carries PermissionActionPublish, never
      # PermissionActionEdit (internal/api/handlers/v0/auth/github_oidc.go,
      # buildPermissions), so there is no way to add `packages` to an entry
      # after the fact. This step is therefore normally the FIRST and ONLY
      # create call for this version's registry entry -- not a fix-up.
      #
      # Every pack repo carries this step (it is the one template every pack
      # uses), but only a gateway-mode pack's server.json has a `packages`
      # entry to add; every other pack reads mode=local below and exits.
      - name: List on the MCP Registry with npm packages entry (gateway-mode packs)
        # Bounded: the mcpName wait below is at most ~10 minutes by default.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mode=$(node -p "require('./package.json').pipeworx?.mode || 'local'" 2>/dev/null || echo local)
          if [ "$mode" != "gateway" ]; then
            echo "mode=$mode -- not a gateway-mode pack, nothing to list on the registry from here"
            exit 0
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          slug=$(node -p "require('./package.json').pipeworx.slug")
          server_name="io.github.pipeworx-io/$slug"

          # The registry's own npm validator fetches <name>/<version> from
          # registry.npmjs.org and requires its mcpName to match. A fresh
          # publish is NOT there immediately: npm's own publish output says
          # "Your package is being processed and may take a few minutes to
          # become available". The old wait here was 6 x 5s through
          # `npm view`, which also reads the npm CLI's local cache -- and the
          # "Skip if this version is already published" step above had just
          # cached this package's packument WITHOUT the new version (the
          # registry serves it max-age=300). On edgar 0.4.0 (fleet #3761) the
          # wait expired and the listing was left absent until a manual
          # re-run a minute later. So: ask the registry directly, uncached,
          # at the same per-version URL the validator reads, for up to
          # MCPNAME_WAIT_TRIES x MCPNAME_WAIT_SECONDS (default 40 x 15s = 10
          # min), and if it still disagrees, FAIL this step. A missing
          # listing is the silent outcome this step exists to prevent; a red
          # run is what makes it visible, and "Re-run failed jobs" retries it
          # (the publish step skips an already-published version).
          tries="${MCPNAME_WAIT_TRIES:-40}"
          pause="${MCPNAME_WAIT_SECONDS:-15}"
          npm_registry="${NPM_REGISTRY_URL:-https://registry.npmjs.org}"
          mcpname=""
          for i in $(seq 1 "$tries"); do
            mcpname=$(node -e '
              const [registry, name, version] = process.argv.slice(1);
              fetch(`${registry}/${name}/${version}`, {
                headers: { accept: "application/json", "cache-control": "no-cache" },
                cache: "no-store",
              }).then(async (r) => {
                if (!r.ok) return;
                const j = await r.json();
                if (j && typeof j.mcpName === "string") process.stdout.write(j.mcpName);
              }).catch(() => {});
            ' "$npm_registry" "$name" "$version" 2>/dev/null || true)
            if [ "$mcpname" = "$server_name" ]; then
              echo "npm serves $name@$version with mcpName=$server_name (check $i of $tries)"
              break
            fi
            if [ "$i" -lt "$tries" ]; then sleep "$pause"; fi
          done
          if [ "$mcpname" != "$server_name" ]; then
            echo "::error::npm still does not serve $name@$version with mcpName=$server_name after $tries checks ${pause}s apart (last saw: ${mcpname:-nothing}) -- the MCP Registry listing was NOT created. Re-run this workflow's failed job to retry; the npm publish itself is done and will be skipped."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("server.json", "utf8"));
            if (!doc.packages) {
              doc.packages = [{
                registryType: "npm",
                identifier: process.argv[1],
                version: process.argv[2],
                transport: { type: "stdio" },
                environmentVariables: [{
                  name: "PIPEWORX_API_KEY",
                  description: "Optional Pipeworx API key. Without it calls are anonymous and capped daily; a free key raises the cap.",
                  isRequired: false,
                  isSecret: true
                }]
              }];
              fs.writeFileSync("server.json", JSON.stringify(doc, null, 2) + "\n");
              console.log("server.json: added packages entry for " + process.argv[1] + "@" + process.argv[2]);
            } else {
              console.log("server.json already carries a packages entry");
            }
          ' "$name" "$version"

          if ! command -v mcp-publisher &>/dev/null; then
            url=$(gh api repos/modelcontextprotocol/registry/releases/latest \
              --jq '.assets[] | select(.name | test("linux_amd64\\.tar\\.gz$")) | .browser_download_url' | head -1)
            if [ -z "$url" ]; then
              echo "::warning::could not resolve the mcp-publisher release asset -- MCP Registry listing not updated"
              exit 0
            fi
            curl -sSL "$url" | tar xz mcp-publisher
            sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          fi
          mcp-publisher login github-oidc

          out=$(mcp-publisher publish 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -eq 0 ]; then
            echo "listed $name@$version on the MCP Registry with a packages entry"
          elif echo "$out" | grep -qiE "already exists"; then
            # The expected shape if this exact version was already listed by
            # some other path (a legacy publish from before this fix, or a
            # repeat run of this workflow). A GitHub-OIDC JWT cannot edit an
            # existing entry (see the step comment above), so there is
            # nothing more this step can do for THIS version -- the next
            # release's version will get packages correctly from here.
            echo "::warning::$server_name $version is already on the MCP Registry (likely remotes-only, from before this fix) and a GitHub-OIDC token cannot edit an existing entry to add packages -- this will self-correct on the next version bump"
          else
            echo "::warning::MCP Registry listing failed for $name@$version: $out"
          fi
